# ─────────────────────────────────────────────────────────────────────────────
# 本仓只有【一个】GitHub Actions 工作流（2026-10-31 合并定案，四仓同构）
#
# 合并前是 3~4 个文件、各自一套 cron，同一天各跑一遍、彼此看不见对方结果：
#   build.yml         上游跟踪 + 整机构建（每日 03:00 CST）
#   check-roceos.yml  roceos 版本核对（每日 03:30 CST，落后即红）
#   sync-roceos.yml   roceos 载荷重建 + 发 release + 改 pin + 派发构建（每日 04:00 CST）
#   dtb-verify.yml    只编板级 DTB 的快速门（仅 lyw-OS 当时有）
#
# 现在：一个 workflow、一条 cron、一条 job 链（needs 串起来，结果互相可见）：
#   upstream → roceos → dtb → build
#   ① upstream：比对 jjm2473/armbian-easepi @ easepi-v26.02 的 HEAD 与 last-upstream-sha，
#               变了就记录新指纹（GITHUB_TOKEN 推的提交不会触发新 run，不会递归）
#   ② roceos  ：查官方 stable_arm/arm64 最新版 → 有新版本就重建本仓载荷、发本仓 release、
#               改三处 pin 并推送。下游 build checkout 到**刚推的提交**，所以旧
#               sync-roceos.yml 里那句 `gh workflow run build.yml` 不再需要（同 run 内接上）。
#   ③ dtb     ：只编板级 DTS 的 4 分钟快验。红了不开 90 分钟的整机；
#               判据与镜像自证同一口径（OS 是 52 条 board-parity，其余仓是 dts-lint + DTB 字节断言）
#   ④ build   ：整机构建 + 产物上传 + 镜像自证
#
# 定时触发只有这一条链：上游无变化且 roceos 无新版 ⇒ 前三步几分钟跑完就结束，不白烧 90 分钟。
# 手动触发用 inputs.task 只做其中一段（等价于合并前那几个独立 workflow 的手动触发）。
# 判据/口径的唯一来源仍是 tools/ 下的脚本 —— 本文件只编排，不重复一份字面量。
# ─────────────────────────────────────────────────────────────────────────────
name: Build iNextOS for NanoPi R5S（单一工作流：上游跟踪 / roceos 跟版 / DTB 快验 / 构建）

on:
  workflow_dispatch:
    inputs:
      profile:
        description: '构建档位：adapted=本仓适配层（默认）｜official=纯官方基线（权威对照物）'
        required: true
        default: adapted
        type: choice
        options:
          - adapted
          - official
      task:
        description: '任务：auto=全链｜check=只检查与跟版、不构建｜build=只构建｜dtb=只跑 DTB 快验'
        required: true
        default: auto
        type: choice
        options:
          - auto
          - check
          - build
          - dtb
  push:
    branches: [ main ]
    paths-ignore:
      # 仅自动记录上游指纹的提交：镜像内容不变，无需重建
      - 'last-upstream-sha'
  schedule:
    # 每日 03:00（CST / UTC+8）一次跑完：上游跟踪 → roceos 跟版 → DTB 快验 → 构建（按需）
    - cron: '0 19 * * *'

# 同一个 ref 只允许一发在跑：新 push / dispatch 会顶掉在跑的那一发（含它的 roceos 跟版；
# 跟版是幂等的：release 用 --clobber 覆盖、pin 无变化就不提交，重跑不会留半成品）。
concurrency:
  group: rr-ci-${{ github.ref }}
  cancel-in-progress: true

# 上游指纹与 roceos pin 都要写回仓库 ⇒ contents: write（发 release 也是它）
permissions:
  contents: write

jobs:
  # ── ① 上游框架跟踪（jjm2473/armbian-easepi @ easepi-v26.02）────────────────────
  upstream:
    name: 上游跟踪（armbian-easepi @ easepi-v26.02）
    runs-on: ubuntu-24.04
    # dispatch 选「只构建」「只跑 DTB」时跳过上游比对
    if: github.event_name != 'workflow_dispatch' || inputs.task == 'auto' || inputs.task == 'check'
    outputs:
      changed: ${{ steps.cmp.outputs.changed }}
      sha: ${{ steps.cmp.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: 比对上游 HEAD 与仓内记录的指纹
        id: cmp
        # 必须带 token：共享 runner 的出口 IP 匿名调 api.github.com 会被打到 403，
        # 本 job 一红，下游就 skipped（lyw-hh run #28 实录）。token 走 env，不嵌进 run 文本。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          UP=$(curl -fsSL --retry 3 --retry-delay 2 \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/jjm2473/armbian-easepi/branches/easepi-v26.02" \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["commit"]["sha"])')
          OLD=$(cat last-upstream-sha 2>/dev/null | tr -d '\n' || echo none)
          echo "上游 easepi-v26.02 HEAD : $UP"
          echo "本仓库记录的指纹         : $OLD"
          if [ "$UP" = "$OLD" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "上游无变化 ⇒ 本次不因上游触发构建。"
          else
            echo "changed=true"  >> "$GITHUB_OUTPUT"
            echo "sha=$UP"       >> "$GITHUB_OUTPUT"
            echo "上游已更新 ⇒ 本次构建最新框架。"
          fi

      - name: 记录新的上游指纹（手动「只检查」模式不写回）
        if: steps.cmp.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.task != 'check')
        run: |
          set -eu
          echo "${{ steps.cmp.outputs.sha }}" > last-upstream-sha
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add last-upstream-sha
          git commit -m "chore: 记录上游框架指纹 ${{ steps.cmp.outputs.sha }} [skip ci]"
          git push origin HEAD:${{ github.ref_name }}

  # ── ② roceos 跟版（跟官方在线升级通道，不跟固件镜像里的版本）──────────────────
  # 合并前的 check-roceos.yml + sync-roceos.yml：核对 → 重建载荷 → 发本仓 release
  # → 改三处 pin（扩展常量 / 本文件的 curl 校验 / official-roceos.txt）→ 推送。
  roceos:
    name: roceos 跟版（核对 → 重建载荷 → 发 release → 改三处 pin）
    needs: upstream
    # 上游比对失败（403 / 网络抖动）不该吞掉跟版与构建；被 cancel 时才停。
    if: |
      always() && !cancelled()
      && (github.event_name != 'workflow_dispatch' || inputs.task == 'auto' || inputs.task == 'check')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    outputs:
      new: ${{ steps.sync.outputs.new }}
      version: ${{ steps.ver.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # upstream 可能刚推了 last-upstream-sha，取最新提交再改 pin
          ref: ${{ github.ref_name }}

      - name: 核对「镜像内置版本」vs 官方 stable_arm/arm64
        id: ver
        run: |
          set +e
          python3 tools/check-roceos.py --pinned official-roceos.txt --summary "$GITHUB_STEP_SUMMARY"
          rc=$?
          # 0=一致 1=落后（下一步自动跟版，这里不判红）2=输入/网络错误 ⇒ 红
          case "$rc" in
            0|1) ;;
            *) echo "!! roceos 版本核对失败（rc=$rc）"; exit "$rc" ;;
          esac
          v=$(sed -n 's/^version:[[:space:]]*//p' official-roceos.txt | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "镜像内置 roceos = ${v}"

      - name: 跟版（下官方包 → 按安装映射重建载荷 → 改三处 pin）
        id: sync
        # 手动「只检查」模式不写仓库；其余一律试一次（已是最新时 rc=0，几秒退出）
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.task != 'check' }}
        run: |
          set +e
          python3 tools/roceos-sync.py --repo lyw-rr
          rc=$?
          # 0=已最新 10=已重建并改好 pin 2=输入/网络/校验失败
          case "$rc" in
            0)  echo "已是最新，无需重建"; echo "new=0" >> "$GITHUB_OUTPUT" ;;
            10) echo "new=1" >> "$GITHUB_OUTPUT" ;;
            *)  echo "!! 跟版失败（rc=$rc）"; exit "$rc" ;;
          esac

      - name: 发本仓 release + 提交三处 pin + 推回主干
        if: steps.sync.outputs.new == '1'
        run: |
          set -eu
          . ./.roceos-sync.env
          echo "新版本 $NEW_VERSION | 载荷 sha256=$NEW_SHA | roceos=$ROCEOS_SHA"
          ls -l roceos-payload.tar.gz

          # ① 发 release（tag 已存在就覆盖资产）
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            gh release upload "$NEW_TAG" roceos-payload.tar.gz --clobber
          else
            NOTE="官方包 $PKG_FILENAME（已按接口给的 sha256/size 校验）; roceos sha256=$ROCEOS_SHA; 由 build.yml 的 roceos job 自动生成"
            gh release create "$NEW_TAG" roceos-payload.tar.gz \
              --title "roceos 载荷 $NEW_VERSION" \
              --notes "$NOTE"
          fi

          # ② 提交三处 pin（载荷与 .roceos-sync.env 在 .gitignore 里）
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "pin 没有变化（可能已同步过），跳过提交"
          else
            git commit -m "chore(roceos): 跟官方 $NEW_VERSION —— 载荷重建 + 三处 pin 同步（自动）"
            # 显式写 ref：checkout 出来的可能是 detached HEAD，裸 `git push` 会报
            # "You are not currently on a branch"。
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

          # ③ 不用再 dispatch：本 run 的下游 build job 在 needs 之后 checkout
          #    ${GITHUB_REF_NAME} 的最新提交（含刚推的 pin），直接接着编。
          echo "下游 build 将使用刚推送的提交（ref=${GITHUB_REF_NAME}）"

  # ── ③ 板级 DTB 快验（原 dtb-verify.yml 的能力，四仓统一）────────────────────
  # 为什么要有这一层：DTS 的 include/label/宏错只有内核树里的 cpp+dtc 才报，代价是整轮
  # 构建（实测 3414 / 3608 秒）；而 dts-lint 只挡纯文本形态错。这里用**与内核同款的
  # cpp+dtc** 编一次板级 DTB（~4 分钟），编不过就停，别开整机。
  # 取树用 codeload tar 片段，不用 `git clone --filter=blob:none --sparse`（实测漏文件：
  # dt-bindings/input/linux-event-codes.h 是指向 include/uapi/linux/ 的软链）。
  dtb:
    name: DTB 快验（只编板级 DTS + 板级判据）
    if: |
      (github.event_name != 'workflow_dispatch' || inputs.task == 'auto' || inputs.task == 'dtb')
      && (github.event_name != 'workflow_dispatch' || (inputs.profile || 'adapted') != 'official')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4
        with:
          # 取分支最新提交：同 run 的 roceos 跟版可能刚推了新的 pin
          ref: ${{ github.ref_name }}
          path: rr

      - name: Install dtc / cpp
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq device-tree-compiler
          dtc --version

      - name: 判据自测（负例不响 = 判据没在干活）
        run: |
          set -e
          echo "--- dts-lint 自测 + 板级 DTS 语法门 ---"
          python3 rr/tools/dts-lint.py --selftest
          python3 rr/tools/dts-lint.py rr/patch/kernel/archive/rockchip64-6.18/dt/rk3568-nanopi-r5s.dts

      - name: 取内核树里的 dts / dt-bindings（codeload tar 片段）
        run: |
          set -e
          curl -fL --retry 3 -o /tmp/kern.tar.gz \
            https://codeload.github.com/gregkh/linux/tar.gz/refs/heads/linux-6.18.y
          ls -lh /tmp/kern.tar.gz
          mkdir -p kern
          tar -xzf /tmp/kern.tar.gz -C kern --strip-components=1 --wildcards \
              '*/arch/arm64/boot/dts/rockchip/*' \
              '*/include/dt-bindings/*' \
              '*/include/uapi/linux/*' \
              '*/scripts/dtc/include-prefixes/*'
          du -sh kern/arch/arm64/boot/dts/rockchip kern/include/dt-bindings
          ls -l kern/scripts/dtc/include-prefixes/dt-bindings

      - name: 用内核同款 cpp + dtc 编译板级 DTB
        run: |
          set -e
          cp rr/patch/kernel/archive/rockchip64-6.18/dt/rk3568-nanopi-r5s.dts kern/arch/arm64/boot/dts/rockchip/
          cd kern
          # 与 scripts/Makefile.lib 的 dtc_cpp_flags 同款（多给两条兜底 include 路径）
          cpp -nostdinc -undef -D__DTS__ -x assembler-with-cpp \
              -I scripts/dtc/include-prefixes \
              -I arch/arm64/boot/dts/rockchip \
              -I include/dt-bindings \
              -I include \
              arch/arm64/boot/dts/rockchip/rk3568-nanopi-r5s.dts -o /tmp/board.prev.dts
          dtc -I dts -O dtb -o /tmp/rk3568-nanopi-r5s.dtb /tmp/board.prev.dts
          ls -l /tmp/rk3568-nanopi-r5s.dtb
          md5sum /tmp/rk3568-nanopi-r5s.dtb

      - name: 板级 DTB 断言（字节级：EEE / 时序两处本仓改过的地方）
        # 只断本仓改过的两项（判据边界见技能 §24）：
        #   ① 千兆 PHY 节点有 eee-broken-1000t（1G EEE 关闭；属性名在 DTB strings 段）
        #   ② phy-mode 是 rgmii 而不是 rgmii-id（rgmii-id 在 rk3568 dwmac 上会清零 MAC 侧延迟，
        #      实测 56B 丢 65% / 1400B 丢 90%，而接口错误计数为 0）
        run: |
          set -e
          python3 - /tmp/rk3568-nanopi-r5s.dtb <<'PY'
          import sys
          p = sys.argv[1]
          d = open(p, 'rb').read()
          assert d[:4] == b'\xd0\x0d\xfe\xed', '不是 FDT（魔数不对）: %r' % d[:4]
          assert b'eee-broken-1000t' in d, 'DTB 里没有 eee-broken-1000t（千兆 EEE 没关，实机会静默收不到包）'
          assert b'rgmii-id' not in d, 'DTB 里仍有 rgmii-id（会把 MAC 侧 tx/rx delay 清零）'
          assert b'rgmii\x00' in d, 'DTB 里没有 phy-mode="rgmii"'
          print('    ✅ eee-broken-1000t 在位 / 无 rgmii-id / phy-mode=rgmii')
          PY

      - name: 上传 DTB（本机可复核，也是整机构建的对照件）
        uses: actions/upload-artifact@v4
        with:
          name: rr-dtb
          path: |
            /tmp/rk3568-nanopi-r5s.dtb
            /tmp/board.prev.dts
          if-no-files-found: error

  build:
    name: Build iNextOS image (NanoPi R5S / RK3568)
    needs: [upstream, roceos, dtb]
    # 触发判据（合并后统一口径）：
    #   · 手动 dispatch：只有 task=auto / build 才构建（check / dtb 不构建）
    #   · 定时 schedule：上游有变化、或 roceos 刚跟到新版（pin 变了）才构建
    #   · push：总是构建
    #   · always()：上游比对失败（403/抖动）不吞掉 push/dispatch 的构建
    #   · DTB 快验红 ⇒ 不构建（快验就是用来挡整机的，别白烧 90 分钟）
    if: |
      always() && !cancelled()
      && needs.dtb.result != 'failure'
      && (github.event_name != 'workflow_dispatch' || inputs.task == 'auto' || inputs.task == 'build')
      && (github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true' || needs.roceos.outputs.new == '1')
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      PROFILE: ${{ github.event.inputs.profile || 'adapted' }}
    steps:
      - name: Checkout board adaptation
        uses: actions/checkout@v4
        with:
          # 取分支最新提交：同 run 的 roceos 跟版可能刚推了新的 pin
          ref: ${{ github.ref_name }}
          path: rr

      - name: Checkout iNextOS build framework (armbian-easepi)
        uses: actions/checkout@v4
        with:
          repository: jjm2473/armbian-easepi
          ref: easepi-v26.02
          path: build

      - name: Show profile
        run: echo "PROFILE=$PROFILE"

      # ── 适配层注入（仅 adapted）────────────────────────────────────────────
      - name: Inject NanoPi R5S board config (adapted)
        if: github.event.inputs.profile != 'official'
        run: |
          set -e
          echo "--- 上游原文件（留档，便于 diff）:"
          head -20 build/config/boards/nanopi-r5s.csc
          cp -v rr/config/boards/nanopi-r5s.csc build/config/boards/
          echo "--- 注入后关键标记:"
          grep -nE 'NAME:="eth[0-9]"|DEFAULT_INTERFACE|^fe2a0000|ethernet0 = |BOOT_FDT_FILE' build/config/boards/nanopi-r5s.csc || true
          # 硬自检：iNextOS 口名钉定的三条规则必须在
          for l in 'KERNELS=="fe2a0000.ethernet", NAME:="eth0"' \
                   'KERNELS=="0000:01:00.0", NAME:="eth1"' \
                   'KERNELS=="0001:11:00.0", NAME:="eth2"'; do
            grep -qF "$l" build/config/boards/nanopi-r5s.csc \
              || { echo "!! csc 缺 udev 规则: $l"; exit 1; }
          done
          # 注意：csc 是 shell 源码，断言用【子串】而不是 ^…$ 锚定行（曾因此在注入步骤白挂一次）
          grep -qF 'DEFAULT_INTERFACE=eth2' build/config/boards/nanopi-r5s.csc \
            || { echo "!! csc 的默认口不是 eth2"; exit 1; }
          grep -qF 'fe2a0000.ethernet,0000:01:00.0,0001:11:00.0' build/config/boards/nanopi-r5s.csc \
            || { echo "!! csc 的 /etc/eth_order 内容不是 eth0/eth1/eth2 三口的顺序"; exit 1; }
          grep -qF 'declare -g NETWORKING_STACK="none"' build/config/boards/nanopi-r5s.csc \
            || { echo "!! csc 没关掉 NetworkManager（缺 NETWORKING_STACK=\"none\"）"; exit 1; }
          grep -qF 'DEFAULT_OVERLAYS="nanopi-r5s-leds nanopi-r5s-fan"' build/config/boards/nanopi-r5s.csc \
            || { echo "!! csc 的 DEFAULT_OVERLAYS 没带 nanopi-r5s-fan"; exit 1; }
          if grep -qE 'NAME:="(wan1|lan1|lan2)"' build/config/boards/nanopi-r5s.csc; then
            echo "!! csc 里仍残留上游 wan1/lan1/lan2 命名"; exit 1
          fi
          # ── 官方口径（2026-10-30 对齐定案，逐条对应一处真实偏差）────────────
          grep -qF 'declare -g RELEASE="trixie"' build/config/boards/nanopi-r5s.csc \
            || { echo '!! csc 没钉死 RELEASE（框架没有板级默认，本地构建会停在交互选择）'; exit 1; }
          # 桌面开关保持【官方 csc 同值】：FULL_DESKTOP 是框架废弃变量（lib/ 全仓无读取者），
          # BOOT_LOGO 只在 BUILD_DESKTOP=yes 时生效（distro-agnostic.sh:591）⇒ CLI 由 CI 的
          # BUILD_DESKTOP=no 决定；在 csc 里改成 no = 自造与官方 csc 的差异（2026-10-31 对齐）。
          grep -qF 'FULL_DESKTOP="yes"' build/config/boards/nanopi-r5s.csc \
            || { echo '!! csc 的 FULL_DESKTOP 与官方 csc 不一致（官方=yes，桌面由 BUILD_DESKTOP=no 关）'; exit 1; }
          grep -qF 'BOOT_LOGO="desktop"' build/config/boards/nanopi-r5s.csc \
            || { echo '!! csc 缺 BOOT_LOGO="desktop"（官方 csc 同值，BUILD_DESKTOP=no 下不生效）'; exit 1; }
          grep -qF 'apt-mark hold linux-dtb-current-rockchip64' build/config/boards/nanopi-r5s.csc \
            || { echo '!! csc 没有 hold 本板 DTB（官方 R1/R2 都有这一步）'; exit 1; }
          grep -qF 'post_family_tweaks__nanopir5s_disable_smartmontools' build/config/boards/nanopi-r5s.csc \
            || { echo '!! csc 缺 smartmontools 对齐钩子（官方：包在、不启用）'; exit 1; }
          echo "csc 注入自检全部通过"

          # ── 板级 DTS 注入（唯一改动 = 千兆 PHY 节点 eee-broken-1000t）──────────
          # 框架的 dts-directories 会把 dt/ 里的 .dts 裸拷进内核树、覆盖同名文件
          # （内核树里本来就有这个板的 DTS 与 Makefile 条目，所以不用改 Makefile）。
          # 不注入 ⇒ 镜像里那颗 DTB 仍是上游默认（1000T EEE 开着）：症状是 carrier 仍 up、
          # 协商仍 1000M、错误计数不涨，但整口静默收不到包，下级设备 30s 后自分配 169.254。
          mkdir -p build/patch/kernel/archive/rockchip64-6.18/dt
          cp -v rr/patch/kernel/archive/rockchip64-6.18/dt/rk3568-nanopi-r5s.dts \
                build/patch/kernel/archive/rockchip64-6.18/dt/
          python3 - <<'PY'
          import sys
          p = "build/patch/kernel/archive/rockchip64-6.18/dt/rk3568-nanopi-r5s.dts"
          src = open(p, encoding="utf-8").read()
          i = src.find("ethernet-phy@1 {")
          if i < 0:
              sys.exit("!! 板级 DTS 里找不到 ethernet-phy@1 节点（千兆 PHY）")
          j = src.find("};", i)
          blk = src[i:j]
          if "eee-broken-1000t" not in blk:
              sys.exit("!! eee-broken-1000t 不在 ethernet-phy@1 节点内（写错位置等于没写）")
          print("     ✅ 千兆 PHY 节点含 eee-broken-1000t（1G EEE 关闭、100M 不动）")
          PY

          # ── LED 触发器修正（2026-10-17 实机定案）─────────────────────────
          # 上游 overlay 把第二块 RTL8125 写成 r8169-1-100:00:link，但它在 PCI domain 0001
          # （0001:11:00.0），内核实际名字是 r8169-1-1100:00 → 触发器永不绑定 → LAN-2 灯一直灭。
          # 用本仓的修正版覆盖框架里所有内核分支的同名 overlay。
          n=0
          for f in build/patch/kernel/archive/rockchip64-*/overlay/rockchip-rk3568-nanopi-r5s-leds.dtso; do
            [ -f "$f" ] || continue
            cp -v rr/config/overlays/rockchip-rk3568-nanopi-r5s-leds.dtso "$f"
            n=$((n+1))
          done
          [ "$n" -ge 1 ] || { echo "!! 框架里没找到 r5s leds overlay（n=$n）"; exit 1; }
          grep -qh 'r8169-1-1100:00:link' build/patch/kernel/archive/rockchip64-*/overlay/rockchip-rk3568-nanopi-r5s-leds.dtso \
            || { echo "!! overlay 未被修正（仍缺 r8169-1-1100:00）"; exit 1; }
          if grep -qhF '"r8169-1-100:00:link"' build/patch/kernel/archive/rockchip64-*/overlay/rockchip-rk3568-nanopi-r5s-leds.dtso; then
            echo "!! overlay 里仍有错误的 r8169-1-100:00:link"; exit 1
          fi
          echo "LED overlay 修正完成（$n 个内核分支）"

          # ── 风扇 overlay（pwm0 + pwm-fan；主线 DTB 没有风扇支持）──────────────
          # 与 LED overlay 同一个内核 overlay 目录，构建时统一编译部署。
          # 按【目录】遍历（不借 leds 文件当路标）：风扇 overlay 的存在与 leds 无关。
          n=0
          for d in build/patch/kernel/archive/rockchip64-*/overlay; do
            [ -d "$d" ] || continue
            cp -v rr/config/overlays/rockchip-rk3568-nanopi-r5s-fan.dtso "$d/"
            n=$((n+1))
          done
          [ "$n" -ge 1 ] || { echo "!! 没找到内核 overlay 目录（n=$n）"; exit 1; }
          grep -qh 'pwm-fan' build/patch/kernel/archive/rockchip64-*/overlay/rockchip-rk3568-nanopi-r5s-fan.dtso \
            || { echo "!! fan overlay 内容不对（缺 pwm-fan）"; exit 1; }
          echo "fan overlay 就位（$n 个内核分支）"

          # ── 登记进 overlay 的 Makefile（不登记＝不编译，run #21 真因）────────────
          # 框架的 arch/arm64/boot/dts/rockchip/overlay/Makefile 是【显式枚举】每个 dtbo 的
          # （dtbo-$(CONFIG_ARCH_ROCKCHIP) += …，再聚合：6.9+ 用 dtb-y += $(dtbo-y)，
          #   6.6 老分支用 targets += $(dtbo-y)）。armbian 的 "Bare OVERLAY auto-patch"
          # 只把文件原样拷进内核树、不会为新 dtso 补登记：leds 因为上游那行在，编了；
          # fan 不在 → 镜像里没有 …-nanopi-r5s-fan.dtbo，4.7GiB 镜像编完、产物上传完，
          # 倒在自证最后一行，风扇也没有 cooling device。
          # 判据单点在本脚本（幂等；缺登记/无聚合行/重复登记/缺 Makefile 一律 rc=1）。
          python3 rr/tools/overlay-makefile-patch.py build/patch/kernel/archive

      - name: Install NanoPi R5S extensions (adapted)
        if: github.event.inputs.profile != 'official'
        run: |
          set -e
          mkdir -p build/userpatches/extensions
          cp -v rr/extensions/*.sh build/userpatches/extensions/
          chmod +x build/userpatches/extensions/*.sh
          ls -l build/userpatches/extensions/
          # 框架只加载【可执行】的扩展；权限不对会被静默跳过（"Found 0 extensions"）
          for fn in lyw_rr_roceos lyw_rr_net_roles lyw_rr_fan lyw_rr_clock; do
            grep -rq "$fn" build/userpatches/extensions/ || { echo "!! 扩展函数缺失: $fn"; exit 1; }
          done
          grep -q 'custom_kernel_config__lyw_rr_board_symbols' \
            build/userpatches/extensions/lyw-rr-kernel-config.sh \
            || { echo "!! kernel-config 扩展缺钩子"; exit 1; }
          grep -q 'ROCEOS_PAYLOAD_SHA256' build/userpatches/extensions/lyw-rr-roceos.sh \
            || { echo "!! roceos 扩展缺载荷指纹"; exit 1; }

      # ── 风扇自检的负例自测（秒级）──────────────────────────────────────────
      # run #19（2026-10-19）：扩展自检 grep -q 'type)... = "pwm-fan"' 把实现代码当正则，
      # 永远不命中 → 镜像已编好却判红，两小时构建白跑。这里直接跑扩展里那段【真实】自检：
      # 正例（脚本正确）必须绿、负例（把 type 比较改坏）必须红 —— 负例不响＝判据没在干活。
      - name: Self-test fan extension self-check (adapted)
        if: github.event.inputs.profile != 'official'
        run: |
          set -e
          bash rr/tools/tests/fan-hook-test.sh

      # ── overlay Makefile 登记判据的负例自测（秒级）────────────────────────────
      # run #21（2026-10-19）：fan.dtso 拷进了 overlay 目录，但框架的 overlay Makefile
      # 是显式枚举每个 dtbo 的 → 没登记就不编译 → 镜像里没有 fan.dtbo。
      # 这里跑 tools/overlay-makefile-patch.py 的六类负例，确保判据真的会拦：
      # 缺登记 / 缺 dtb-y 聚合行 / 重复登记 / 缺 Makefile / 一个分支都没拷到 dtso / 幂等。
      - name: Self-test overlay Makefile registration (adapted)
        if: github.event.inputs.profile != 'official'
        run: |
          set -e
          bash rr/tools/tests/overlay-makefile-patch-test.sh

      # ── 板级 DTS 语法门（秒级；dtc 只在 make dtbs 才报，代价是整轮构建 3400+ 秒）──
      # 覆盖：括号/尖括号配平、属性值形态（CPP `<<`/`>>` 按运算符处理）、
      #       **属性写在子节点之后**（dtc: Properties must precede subnodes）。
      # 负例已验：`= 100>;` 报形态非法 + 多余的 >；子节点后再写属性报 prop-order。
      - name: Lint board DTS syntax (adapted)
        if: github.event.inputs.profile != 'official'
        run: |
          set -e
          python3 rr/tools/dts-lint.py \
            rr/patch/kernel/archive/rockchip64-6.18/dt/rk3568-nanopi-r5s.dts

      # ── 角色映射判据（秒级；把「最后一分钟才红」的那类事故提前到构建前）──────────
      # 2026-10-17 run #14：默认 ROLE_MAP 改了，镜像自证里还留着旧口径的字面量 →
      # 4.7GB 镜像全部断言绿、只在最后一行红，117 分钟白跑。判据现在单点定义在
      # tools/role-map-check.py：这里对【仓库里将要写进镜像的默认值】跑一遍，
      # 构建后再对【镜像里实际落盘的那份】跑同一份判据。
      - name: Lint NIC role-map policy (adapted)
        if: github.event.inputs.profile != 'official'
        run: |
          set -e
          python3 rr/tools/role-map-check.py --src rr/extensions/lyw-rr-net-roles.sh
          # 判据脚本自身的负例自测：漏口/重复口/WAN 吞并 2.5G/默认值被抄了第二份，四种必红形态
          bash rr/tools/tests/role-map-check-test.sh

      - name: Fetch roceos web-UI payload into userpatches/overlay (adapted)
        if: github.event.inputs.profile != 'official'
        run: |
          set -e
          mkdir -p build/userpatches/overlay
          URL="https://github.com/linyueweia/lyw-rr/releases/download/roceos-payload-v2/roceos-payload.tar.gz"
          curl -fsSL -o build/userpatches/overlay/roceos-payload.tar.gz "$URL"
          echo "cbd911c6fad5a3655bc52a39e4099b8812c70d8358840e1d1d8bf6db956703d1  build/userpatches/overlay/roceos-payload.tar.gz" | sha256sum -c -
          ls -l build/userpatches/overlay/

      - name: Set up QEMU (binfmt_misc for arm64 cross-build)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean
          df -h /

      # ── 自证脚本自测（几秒，防"构建 2 小时后才发现脚本的分区假设是错的"）──────
      # 造两个微型镜像（单分区 rootfs / 双分区 bootfs+rootfs），只跑 verify-image.sh
      # 的布局探测并断言判定结果 —— 覆盖 iNextOS 的两种官方分区布局。
      - name: Self-test image layout detection (mock images)
        run: |
          set -e
          mkdir -p "$RUNNER_TEMP/mock" && cd "$RUNNER_TEMP/mock"
          chmod +x "$GITHUB_WORKSPACE/rr/tools/verify-image.sh"
          probe() { sudo -E bash "$GITHUB_WORKSPACE/rr/tools/verify-image.sh" --probe "$1"; }
          sudo mkdir -p /mnt/ib /mnt/ir

          # ① 单分区（= 本板上游 nanopi-r5s 官方路径，同官方 H88K 镜像）
          truncate -s 96M one.img
          parted -s one.img mklabel gpt >/dev/null
          parted -s one.img mkpart rootfs ext4 16MiB 100% >/dev/null
          L=$(sudo losetup --show -f -P one.img); sudo mkfs.ext4 -qF "${L}p1"; sudo losetup -d "$L"
          OUT1=$(probe one.img); echo "$OUT1"
          echo "$OUT1" | grep -q 'LAYOUT rootfs=[^ ]*p1 bootfs=none ' \
            || { echo "!! 单分区布局判定错（应 rootfs=p1 / bootfs=none）"; exit 1; }

          # ② 双分区（= 官方 easepi-r1 布局：csc 里 BOOTFS_TYPE="fat"）
          truncate -s 160M two.img
          parted -s two.img mklabel gpt >/dev/null
          parted -s two.img mkpart bootfs fat32 16MiB 96MiB >/dev/null
          parted -s two.img mkpart rootfs ext4 96MiB 100% >/dev/null
          L=$(sudo losetup --show -f -P two.img); sudo mkfs.vfat "${L}p1" >/dev/null; sudo mkfs.ext4 -qF "${L}p2"; sudo losetup -d "$L"
          OUT2=$(probe two.img); echo "$OUT2"
          echo "$OUT2" | grep -q 'LAYOUT rootfs=[^ ]*p2 bootfs=[^ ]*p1 ' \
            || { echo "!! 双分区布局判定错（应 rootfs=p2 / bootfs=p1）"; exit 1; }

          echo "布局探测自测通过（单分区 / 双分区两种官方布局都认得）"
          rm -f one.img two.img

          # 辅助函数自测（node_status / DTS 文本解析）—— 同样必须在 Build 之前过
          echo
          bash "$GITHUB_WORKSPACE/rr/tools/tests/verify-helpers-test.sh"

      # ── 包集合判据自身的正/负例自测（秒级）──────────────────────────────────
      # 2026-10-31 run #39：这条判据的新写法（来源减法）第一次上阵就因为「写法过宽」
      # 把 15 个官方 minimal 也有的包判成偏差，整轮 117 分钟白跑。判据自己必须先跑通
      # 3 正例（base / 扩展 / 依赖 / apt auto 四种合法来源）+ 6 负例（真偏差必须红）。
      - name: Self-test packages parity gate
        run: |
          set -e
          python3 rr/tools/packages-parity-check.py --selftest

      - name: Build iNextOS image
        run: |
          cd build
          # 注释必须放在整条命令【之前】：放进 "\" 续行之间会把后续参数整段注释掉
          if [ "$PROFILE" = "adapted" ]; then
            EXTS="istorenext,lyw-rr-roceos,lyw-rr-kernel-config,lyw-rr-net-roles,lyw-rr-fan,lyw-rr-clock"
          else
            EXTS="istorenext"
          fi
          echo "ENABLE_EXTENSIONS=$EXTS"
          # BUILD_MINIMAL=yes = 官方发布件口径（文件名带 _minimal、718 包）。
          # 传 no 会装整份 packages.additional（avahi-autoipd/unattended-upgrades/…），
          # 实测 958 包，并把"DHCP 失败塞 169.254 / 后台自动升级"带进产物。
          ./compile.sh build \
            BOARD=nanopi-r5s \
            BRANCH=current \
            RELEASE=trixie \
            ENABLE_EXTENSIONS="$EXTS" \
            BUILD_MINIMAL=yes \
            BUILD_DESKTOP=no \
            KERNEL_CONFIGURE=no \
            COMPRESS_OUTPUTIMAGE="sha,img,xz" \
            SHARE_LOG=yes \
            EXPERT=yes

      - name: Show outputs
        run: |
          ls -lh build/output/images/ || true
          cat build/output/images/*.sha 2>/dev/null || true

      # 上传放在自证【之前】：自证失败也不能白造一个镜像
      # （2026-10-16 run #4 的教训 —— 117 分钟构建出的镜像因自证误报没上传，连诊断素材都没有）
      - name: Upload iNextOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: inextos-nanopi-r5s-${{ env.PROFILE }}
          path: |
            build/output/images/*.img.xz
            build/output/images/*.sha
          retention-days: 14
          if-no-files-found: error

      - name: Post-process verification (image self-check)
        run: |
          set -e
          IMG=$(ls build/output/images/*.img | head -n1)
          echo "IMG=$IMG"
          chmod +x rr/tools/verify-image.sh
          # 包集合核对：判据单点在 tools/packages-parity-check.py（自证脚本里调它）。
          # 传【构建树】而不是单个清单文件 —— 判据自己复现框架的聚合口径
          #   config/cli/<rel>/main + config/optional/_any_board + config/optional/architectures/<arch>
          # 否则 gpiod（只在 optional/architectures/arm64 层）这类包会被误判成「多出来的包」。
          export BUILD_TREE="$GITHUB_WORKSPACE/build"
          # 扩展源码清单（判据用它识别 add_packages_to_image 带入的包）；用 printf 拼，避免反斜杠转义
          PACKAGES_EXTENSION_FILES="$(printf '%s ' $GITHUB_WORKSPACE/build/extensions/istorenext.sh $GITHUB_WORKSPACE/build/userpatches/extensions/*.sh)"
          export PACKAGES_EXTENSION_FILES
          sudo -E bash rr/tools/verify-image.sh "$IMG" "$PROFILE"
