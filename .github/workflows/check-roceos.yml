name: Check official roceos version

# roceos（iNextOS 网页后台）有自己的在线升级通道，固件镜像里打进去的版本必然落后于线上最新版
# （实证：官方 2.9.1 固件镜像内是 2.9.x，同一台实机 OTA 后已是 3.0.2）。
# 本 job 每天问一次官方更新服务器：
#   镜像内置版本（official-roceos.txt 的 version）≠ 官方 stable_arm/arm64 最新版 ⇒ 红
# 红 = 「该重建 roceos 载荷了」。构建链路本身由 build.yml 负责，两者互不影响。
#
# 更新地址是 2026-10-31 从 roceos 二进制里取的常量（不是文档抄的）：
#   http://update.roceos.com:14380/api/v1/updates/check?version=<当前>&channel=stable_arm&arch=arm64
#   arm64 设备走 stable_arm；用 stable 只会拿到 x86_64 包。
on:
  schedule:
    - cron: '30 19 * * *'   # 每日 03:30 CST
  workflow_dispatch:

jobs:
  check:
    name: Compare pinned roceos with official (stable_arm / arm64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Query update.roceos.com and compare
        run: |
          set -eu
          python3 tools/check-roceos.py --pinned official-roceos.txt --summary "$GITHUB_STEP_SUMMARY"
