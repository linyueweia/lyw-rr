name: Sync roceos payload with official

# 官方 roceos（iNextOS 网页后台）有在线升级通道，固件镜像里打进去的版本必然落后于线上最新版
# （实证：官方 2.9.1 固件镜像内是 2.9.x，同一台实机 OTA 后已是 3.0.2）。
#
# 本 job 每天跑一次（排在 check-roceos 之后）：
#   ① 查官方 stable_arm/arm64 最新版 → ② 下官方包，按接口给的 sha256/size 校验
#   ③ 按官方安装映射把包覆盖进上一份载荷，重建 **本仓自己的** 载荷（tools/roceos-sync.py）
#   ④ 发本仓 release（tag = roceos-payload-<版本>）
#   ⑤ 改三处 pin（扩展常量 / build.yml 的 curl 校验 / official-roceos.txt）
#   ⑥ commit + push，然后**显式 dispatch build.yml**
#      —— GITHUB_TOKEN 推的提交不会触发其它 workflow，这一步不能省。
#
# 不需要任何 secret：只用 job 自带的 GITHUB_TOKEN（contents: write 发 release/推提交，
# actions: write 派发构建）。
on:
  schedule:
    - cron: '0 20 * * *'   # 每日 04:00 CST（check-roceos 03:30 先跑，红了先通知人）
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: roceos-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    name: Sync roceos payload with official (lyw-rr)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Sync (download official package, rebuild payload, patch pins)
        id: sync
        run: |
          set +e
          python3 tools/roceos-sync.py --repo lyw-rr
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0)  echo "已是最新，不需要重建" ;;
            10) echo "new=1" >> "$GITHUB_OUTPUT" ;;
            *)  echo "!! 同步失败（rc=$rc）"; exit "$rc" ;;
          esac

      - name: Publish release, commit pins, dispatch build
        if: steps.sync.outputs.new == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          . ./.roceos-sync.env
          echo "新版本 $NEW_VERSION | 载荷 sha256=$NEW_SHA | roceos=$ROCEOS_SHA"
          ls -l roceos-payload.tar.gz

          # ① 发 release（tag 已存在就覆盖资产）
          if gh release view "$NEW_TAG" >/dev/null 2>&1; then
            gh release upload "$NEW_TAG" roceos-payload.tar.gz --clobber
          else
            NOTE="官方包 $PKG_FILENAME（已按接口给的 sha256/size 校验）; roceos sha256=$ROCEOS_SHA; 由 sync-roceos.yml 自动生成"
            gh release create "$NEW_TAG" roceos-payload.tar.gz \
              --title "roceos 载荷 $NEW_VERSION" \
              --notes "$NOTE"
          fi

          # ② 提交三处 pin（payload 与 env 已在 .gitignore 里）
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo "pin 没有变化（可能已同步过），跳过提交"
          else
            git commit -m "chore(roceos): 跟官方 $NEW_VERSION —— 载荷重建 + 三处 pin 同步（自动）"
            git push
          fi

          # ③ 显式派发整机构建（GITHUB_TOKEN 的提交不会触发 build.yml）
          gh workflow run build.yml --ref "${GITHUB_REF_NAME:-main}"
          echo "已派发 build.yml"
